<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header style="background-color:#282D9C;">
    <h1 style="margin-left: 400px; color: white; font-size: 55px;">Student Registration Form</h1>
    <p style="margin-left: 500px; color: white;">Fill the Detail Below to Complete your Registration</p>
    </header><br>

<form action="/mmm.html"style="margin-left: 60px;">
            <label for="" style="background-color: #C4D6F2; font-size:20px;
                    padding-right: 1000px;">Personal Information</label><br><br>  
            <label for="Full Name:">Full Name:</label>
            <input type="text" placeholder="enter your full name" size="130px" name="Full Name:
                  " style="margin-left: 50px;"><br><br><br>
            <label for="Email Address:">Email Address:</label>
            <input type="text" name="Email Address:" placeholder="enter your email"
                  size="60px" style="margin-left: 30px;">
            <label for="Date of Birth:" style="margin-left: 100px;">Date of Birth:</label><br>
            <input type="date" name="Date of Birth:"style="margin-left: 670px";><br><br>
            <label for="Password:">Password:</label>
            <input type="text" placeholder="enter your Password" name="Password:" size="61px"
                   maxlength="10" minlength="5" style="margin-left:55px ;">
            <label for="Confirm Password:" style="margin-left: 100px;">Confirm Password:</label><br>
            <input type="text" placeholder="Re-enter your Password" name="Confirm Password:" size="61px"
                   maxlength="10" minlength="5" style="margin-left: 670px;"><br><br>
            <label for="Contact:">Contact:</label>
            <input type="text" name="Contact:" placeholder="enter your contact number" size="130px"
                    style="margin-left: 50px;"><br><br><br>
            <label for="" style="background-color: #C4D6F2;font-size:20px;
                    padding-right: 1100px;">Gender</label><br><br>
             <label for="">Male</label>
             <input type="radio" name="Gender" value="Male" checked>
             <label for="">Female</label>
             <input type="radio" name="Gender" value="Female">
             <label for="">Other</label>
             <input type="radio" name="Gender" value="Other"><br><br>
             <label for="" style="background-color: #C4D6F2;font-size:20px;
                    padding-right: 1050px;">Select Courses</label>
              <p style="color: #BDC2CC;">choose the courses you want enroll in(you can select multiple)</p>
              <label for="">Html</label>
              <input type="checkbox" name="select" value="Html" checked>
              <label for="">Css</label>
              <input type="checkbox" name="select" value="Css">
              <label for="">Java script</label>
              <input type="checkbox" name="select" value="Java script">
              <label for="">React</label>
              <input type="checkbox" name="select" value="React">
              <label for="">python</label>
              <input type="checkbox" name="select" value="python"><br><br>
              <label for="" style="background-color: #C4D6F2;font-size:20px;
                    padding-right: 1000px;">Additional Information</label><br><br>    
               <label for="">Address</label><br>
               <!-- <input type="text" size="160" placeholder="enter your address">       -->
                <textarea name="" id="" cols="150" rows="5" 
                     placeholder="enter your address"></textarea><br><br>
              <input type="submit" style="background-color: #1F7D25; padding-left: 600px;
                      font-size: 15px; padding-right: 540px; border: 2px solid; color: white;">


</form>
    
    
</body>
</html>
