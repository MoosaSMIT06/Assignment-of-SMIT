<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table style="border: 4px solid;color: #F0F0F0; background-color: #F0F0F0;">
        <tr>
            <td><a href="index.html">Home</a></td>
            <td><a style="padding-left: 200px;" href="about.html">About us</a></td>
            <td><a style="padding-left: 240px;" href="courses.html">courses</a></td>
            <td><a style="padding-left: 240px;" href="student.html">Student</a></td>
            <td><a style="padding-left: 240px;" href="registration.html">Registration</a></td>
        </tr>
    </table>
    <header style="background-color: #ACE1FA; height: 100px;">
        <h1 style="padding-top: 25px; padding-left: 35%;">Student Registration Form</h1>
    </header><br><br><br>
    <main>
    <form action="index.html">

    <table border="1" style="border-color: #DEDEDE; font-size: 30px; margin-left: 20%;">

        <tr>
            <td><label><b>Full Name:</b></label></td>
            <td><input type="text" size="40" placeholder="Enter Your Full Name"></td>
        </tr>

        <tr>
            <td><label><b>Email:</b></label></td>
            <td><input type="email" size="40" placeholder="Enter Your email"></td>
        </tr>

        <tr>
            <td><label><b>Password:</b></label></td>
            <td><input type="password" size="40" placeholder="Enter your Password" minlength="5"></td>
        </tr>

        <tr>
            <td><label><b>Gender:</b></label></td>
            <td>
                Male <input type="radio" name="gender" checked>
                Female <input type="radio" name="gender">
                Other <input type="radio" name="gender">
            </td>
        </tr>

        <tr>
            <td><label><b>Select Courses:</b></label></td>
            <td>
                HTML <input type="checkbox" checked>
                Css <input type="checkbox">
                Java script <input type="checkbox">
                Python <input type="checkbox">
            </td>
        </tr>

        <tr>
            <td><label><b>Address:</b></label></td>
            <td>
                <textarea placeholder="Enter your address" rows="5" cols="39"></textarea>
            </td>
        </tr>

    </table>

    <br>

    <input type="submit" value="Submit" style="font-size: 15px; margin-left: 50%;">

</form>
</main>
    
</body>
</html>
